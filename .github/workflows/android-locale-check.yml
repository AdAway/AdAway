name: Android locale validation

on:
  pull_request:
    branches:
      - master
    paths:
      - 'app/src/main/res/values*/string*.xml'

# Only validate the last push of a pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate locales
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
      # List the pull request changed files
      pull-requests: read

    steps:
      # Check out the pull request branch instead of the merge commit to commit the patch on it
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47.0.1
        with:
          # Use the API as the local origin is the fork for fork pull requests
          use_rest_api: true

      - name: Validate locale files
        id: validation
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          cd ${GITHUB_WORKSPACE}
          java .github/workflows/AndroidLocaleChecker.java ${ALL_CHANGED_FILES}

      - name: Commit patch
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        if: steps.validation.outputs.patch_applied == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          commit_message: 'chore(locale): Fix contribution'
          commit_author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'

      # The GITHUB_TOKEN can't push to forks
      - name: Report patch
        if: steps.validation.outputs.patch_applied == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          git diff
          echo "::error::Some locale files need fixes. Apply the diff above to your branch."
          exit 1
