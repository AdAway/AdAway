plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.ksp)
    alias(libs.plugins.kotlin.compose)
}

boolean keyStoreDefined = project.hasProperty('signingStoreLocation') &&
        project.hasProperty('signingStorePassword') &&
        project.hasProperty('signingKeyAlias') &&
        project.hasProperty('signingKeyPassword')

android {
    compileSdk 37
    ndkVersion = '27.2.12479018'
    namespace = 'org.adaway'

    defaultConfig {
        minSdk 26
        targetSdk 37
        versionCode libs.versions.appCode.get() as int
        versionName libs.versions.appName.get()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    /*
     * To sign release build, create file gradle.properties in ~/.gradle/ with this content:
     *
     * signingStoreLocation=/home/key.store
     * signingStorePassword=xxx
     * signingKeyAlias=alias
     * signingKeyPassword=xxx
     */
    if (keyStoreDefined) {
        println "Found signature properties in gradle.properties. Build will be signed."

        signingConfigs {
            release {
                storeFile file(signingStoreLocation)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }

        buildTypes.debug.signingConfig = signingConfigs.release
        buildTypes.release.signingConfig = signingConfigs.release
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
    }


    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
//        debug {
//            shrinkResources false
//            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
//        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Do not abort build if lint finds errors
    lint {
        disable 'MissingTranslation'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas".toString())
    arg("room.incremental", "true")
}

dependencies {
    implementation project(':tcpdump')
    implementation project(':webserver')

    implementation libs.guava
    implementation libs.kotlinx.coroutines.android
    implementation libs.material
    implementation libs.timber

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.navigation.compose
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.paging.compose
    implementation libs.androidx.paging.runtime
    implementation libs.androidx.room.paging
    implementation libs.androidx.room.runtime
    implementation libs.androidx.work.runtime
    ksp libs.androidx.room.compiler

    implementation libs.okhttp3.okhttp
    implementation libs.okhttp.dnsoverhttps

    if (keyStoreDefined) {
        implementation project(':sentrystub')
    } else {
        implementation platform(libs.sentry.bom)
        implementation libs.sentry.android
        implementation libs.sentry.android.fragment
        implementation libs.sentry.android.timber
    }

    implementation libs.libsu

    implementation libs.bundles.pcap4j
    implementation libs.dnsjava
    implementation libs.slf4j.android

    testImplementation libs.json
    testImplementation libs.junit
    androidTestImplementation libs.bundles.androidx.test
    androidTestImplementation libs.junit
}
